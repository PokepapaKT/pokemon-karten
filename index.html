<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartenbinder</title>
<meta name="description" content="Pokémon-Karten scannen, sammeln und den Wert über Cardmarket ermitteln.">
<meta name="theme-color" content="#1d2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kartenbinder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Kartenbinder</span>
    </div>
    <div class="total" id="totalBox">
      <span class="total-label">Sammlungswert</span>
      <span class="total-value" id="totalValue">0,00 €</span>
    </div>
  </div>
</header>

<main id="main">
  <!-- Sammlung -->
  <section class="view" id="view-collection" aria-labelledby="h-collection">
    <h1 id="h-collection" class="sr-only">Meine Sammlung</h1>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input id="colFilter" type="search" placeholder="In Sammlung suchen…" autocomplete="off">
      <div class="toolbar-row">
        <label class="select">
          <span>Sortieren</span>
          <select id="colSort">
            <option value="value">Höchster Wert</option>
            <option value="name">Name A–Z</option>
            <option value="set">Set und Nummer</option>
            <option value="added">Zuletzt hinzugefügt</option>
            <option value="rarity">Seltenheit</option>
          </select>
        </label>
        <label class="select">
          <span>Sprache</span>
          <select id="colLang">
            <option value="">Alle</option>
            <option value="de">Deutsch</option>
            <option value="en">Englisch</option>
            <option value="ja">Japanisch</option>
          </select>
        </label>
      </div>
    </div>
    <div id="colList" class="col-list"></div>
    <div class="col-actions">
      <button class="btn ghost" id="btnRefresh" type="button">Preise aktualisieren</button>
      <button class="btn ghost" id="btnExport" type="button">Sicherung speichern</button>
      <label class="btn ghost" for="importFile">Sicherung laden</label>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
    <p class="hint" id="refreshInfo"></p>
  </section>

  <!-- Scannen und Suchen -->
  <section class="view" id="view-add" hidden aria-labelledby="h-add">
    <h1 id="h-add" class="sr-only">Karte hinzufügen</h1>
    <div class="lang-switch" role="radiogroup" aria-label="Sprache der Karte">
      <button type="button" role="radio" data-lang="de" aria-checked="true">Deutsch</button>
      <button type="button" role="radio" data-lang="en" aria-checked="false">Englisch</button>
      <button type="button" role="radio" data-lang="ja" aria-checked="false">Japanisch</button>
    </div>

    <label class="scan-cta" for="scanFile">
      <span class="scan-frame" aria-hidden="true"><span></span></span>
      <span class="scan-text">
        <strong>Karte fotografieren</strong>
        <small>Gerade von oben, gutes Licht, Kartennummer unten gut sichtbar</small>
      </span>
    </label>
    <input id="scanFile" type="file" accept="image/*" capture="environment" hidden>

    <div id="scanStatus" class="scan-status" hidden></div>

    <form id="searchForm" class="search" autocomplete="off">
      <label for="searchInput" class="search-label">Oder suchen nach Name oder Nummer</label>
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="z. B. Glurak oder 025/165" enterkeyhint="search">
        <button class="btn primary" type="submit">Suchen</button>
      </div>
    </form>

    <div id="results" class="results"></div>
  </section>
</main>

<nav class="tabbar" aria-label="Bereiche">
  <button type="button" class="tab" data-view="collection" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="9" rx="1.5"/><rect x="14" y="4" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="18" height="5" rx="1.5"/></svg>
    <span>Sammlung</span>
  </button>
  <button type="button" class="tab" data-view="add">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M12 9v6M9 12h6"/></svg>
    <span>Hinzufügen</span>
  </button>
</nav>

<!-- Kartendetails -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <button class="sheet-close" id="sheetClose" type="button" aria-label="Schließen">×</button>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
